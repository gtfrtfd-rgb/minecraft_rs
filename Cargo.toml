[package]
name = "minecraft_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "30.0.1", features = ["vulkan"] }
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true