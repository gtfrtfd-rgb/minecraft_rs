[package]
name = "minecraft_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
wgpu = { version = "30.0.1", features = ["vulkan"] }
winit = "0.30"
pollster = "0.3"
bytemuck = { version = "1", features = ["derive"] }
glam = "0.29"
log = "0.4"
env_logger = "0.11"

# Настройки для обычной сборки (cargo run)
[profile.dev]
opt-level = 1  # Ваш код компилируется быстро

# Оптимизируем только зависимости (wgpu, winit и т.д.), чтобы игра летала
[profile.dev.package."*"]
opt-level = 3

# Настройки для релизной сборки (cargo run --release)
[profile.release]
opt-level = 3
# Заменили lto = true на "thin". Это дает почти такой же FPS, 
# но собирается в разы быстрее.
lto = "thin"